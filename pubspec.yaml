name: inventory_management_system
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.13.3


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  excel: ^4.0.6
  file_picker: ^13.1.0
  share_plus: ^13.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  




flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo.png

flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#F5F7FA"
  adaptive_icon_foreground: "assets/logo.png"  

  